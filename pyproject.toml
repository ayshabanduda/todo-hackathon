[project]
name = "todo-cli-python"
version = "0.1.0"
description = "A simple in-memory Todo CLI app in Python"
authors = [
    {name = "Spec Architect", email = "architect@example.com"}
]
dependencies = []
requires-python = ">=3.13"

[project.scripts]
todo = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
